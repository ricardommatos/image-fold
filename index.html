<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Image Fold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fg: #000;
      --muted: rgba(0, 0, 0, 0.4);
      --border: #000;
      --panel-bg: rgba(255, 255, 255, 0.92);
      --accent: #0f62fe;
      --stage-bg: #1a1a1a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 400;
      color: var(--fg);
      background: var(--stage-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* === STAGE === */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--stage-bg);
      overflow: hidden;
    }

    #canvas-3d {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      perspective: 1000px;
      transform-style: preserve-3d;
      display: none; /* hidden until image loads */
    }
    #canvas-3d.has-image { display: block; }

    /* Wrapper that handles the orbit (view rotation) — children hold the fold */
    #layers-wrap {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      cursor: grab;
      pointer-events: all;
      will-change: transform;
    }
    #layers-wrap:active { cursor: grabbing; }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 10;
    }

    #overlay .break-line {
      stroke: #ffffff;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.6));
      vector-effect: non-scaling-stroke;
    }

    #overlay .handle {
      fill: #ffffff;
      stroke: rgba(0, 0, 0, 0.4);
      stroke-width: 1;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.4));
      cursor: grab;
      pointer-events: all;
      transition: r 0.12s ease;
    }
    #overlay .handle:hover { fill: var(--accent); }
    #overlay .handle.dragging { cursor: grabbing; fill: var(--accent); }

    /* === DROPZONE === */
    #dropzone {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      z-index: 5;
    }
    #dropzone.hidden { display: none; }

    #dropzone .target {
      width: 480px;
      max-width: 80vw;
      height: 320px;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: border-color 0.16s linear, background 0.16s linear;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
    }
    #dropzone .target:hover {
      border-color: rgba(255, 255, 255, 0.7);
      color: rgba(255, 255, 255, 0.9);
    }
    #dropzone .target.drag-over {
      border-color: var(--accent);
      border-style: solid;
      background: rgba(15, 98, 254, 0.08);
      color: #ffffff;
    }
    #dropzone .target .icon {
      width: 32px;
      height: 32px;
      border: 1px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 500;
    }
    #dropzone .target .label {
      font-weight: 500;
    }
    #dropzone .target .hint {
      font-size: 10px;
      letter-spacing: 0.16em;
      opacity: 0.7;
    }

    /* === UI PANEL === */
    #ui {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 272px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border: 1px solid var(--border);
      padding: 16px 16px 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
      line-height: 1.2;
      user-select: none;
      z-index: 100;
    }

    #ui .title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 600;
      font-size: 10px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    #ui .title .muted { font-weight: 400; color: var(--muted); }

    #ui .group {
      margin-bottom: 14px;
    }

    #ui .group-label {
      font-size: 9px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #ui .group-label::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 1px;
      background: var(--muted);
    }

    #ui .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    #ui .row label {
      flex: 0 0 60px;
      font-size: 10px;
    }
    #ui .row .value {
      flex: 0 0 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 10px;
    }

    #ui input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 1px;
      background: #000;
      outline: none;
      margin: 0;
      padding: 0;
    }
    #ui input[type="range"]::-webkit-slider-runnable-track {
      height: 1px;
      background: #000;
    }
    #ui input[type="range"]::-moz-range-track {
      height: 1px;
      background: #000;
    }
    #ui input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      background: #000;
      cursor: pointer;
      border: none;
      margin-top: -4.5px;
      border-radius: 0;
    }
    #ui input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      background: #000;
      cursor: pointer;
      border: none;
      border-radius: 0;
    }

    #ui button {
      font-family: inherit;
      font-size: 10px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 7px 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.12s linear, color 0.12s linear;
      -webkit-tap-highlight-color: transparent;
    }
    #ui button:hover {
      background: #000;
      color: #fff;
    }

    #ui .full-btn {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 9px;
    }
    #ui .full-btn:first-of-type { margin-top: 0; }

    #ui .full-btn.primary {
      background: #000;
      color: #fff;
    }
    #ui .full-btn.primary:hover {
      background: var(--accent);
      color: #fff;
    }

    #ui .hint {
      font-size: 8px;
      color: var(--muted);
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    #ui .filename {
      display: block;
      width: 100%;
      padding: 5px 8px;
      margin-top: 6px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      background: rgba(0, 0, 0, 0.04);
      font-size: 9px;
      letter-spacing: 0.06em;
      color: rgba(0, 0, 0, 0.6);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #file-input { display: none; }
  </style>
</head>
<body>
  <!-- UI PANEL -->
  <div id="ui">
    <div class="title">
      <span>Image · Fold</span>
      <span class="muted">v1</span>
    </div>

    <div class="group">
      <div class="group-label">Image</div>
      <button class="full-btn" id="ctl-upload">Upload Image</button>
      <div class="filename" id="filename" style="display: none;">—</div>
    </div>

    <div class="group">
      <div class="group-label">Fold</div>
      <div class="row">
        <label>Angle</label>
        <input type="range" id="ctl-angle" min="0" max="80" step="1" value="30">
        <span class="value" id="val-angle">30°</span>
      </div>
      <div class="row">
        <label>Depth</label>
        <input type="range" id="ctl-depth" min="400" max="2000" step="50" value="1000">
        <span class="value" id="val-depth">1000</span>
      </div>
    </div>

    <div class="group">
      <div class="group-label">View</div>
      <button class="full-btn" id="ctl-reset-view">Reset View</button>
    </div>

    <div class="group">
      <div class="group-label">Line</div>
      <button class="full-btn" id="ctl-reset-line">Reset Line</button>
    </div>

    <button class="full-btn" id="ctl-reset">Reset All</button>
    <div class="btn-row" style="display: flex; gap: 4px; margin-top: 6px;">
      <button class="full-btn" id="ctl-export-svg" style="flex: 1; margin-top: 0;">Export SVG</button>
      <button class="full-btn primary" id="ctl-export-png" style="flex: 1; margin-top: 0;">Export PNG</button>
    </div>

    <div class="hint">Drag handles · Drag image to orbit · Drop image</div>
  </div>

  <!-- STAGE -->
  <div id="stage">
    <div id="canvas-3d">
      <div id="layers-wrap">
        <img class="layer top" id="layer-top" alt="">
        <img class="layer bottom" id="layer-bottom" alt="">
        <svg id="overlay" preserveAspectRatio="none" viewBox="0 0 100 100">
          <line class="break-line" id="break-line" x1="25" y1="50" x2="75" y2="50" />
          <circle class="handle" id="handle-a" data-point="a" cx="25" cy="50" r="1.2" />
          <circle class="handle" id="handle-b" data-point="b" cx="75" cy="50" r="1.2" />
        </svg>
      </div>
    </div>

    <div id="dropzone">
      <div class="target" id="dropzone-target">
        <div class="icon">+</div>
        <div class="label">Drop image or click</div>
        <div class="hint">PNG · JPG · WebP · SVG</div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
    // ============================================================
    // STATE
    // ============================================================
    const DEFAULTS = Object.freeze({
      pointA: { x: 0.25, y: 0.5 },
      pointB: { x: 0.75, y: 0.5 },
      angle: 30,
      perspective: 1000,
      orbitX: 0,  // rotation around X axis (vertical drag)
      orbitY: 0,  // rotation around Y axis (horizontal drag)
    });

    const state = {
      imageSrc: null,
      imageW: 0,
      imageH: 0,
      filename: null,
      pointA: { ...DEFAULTS.pointA },
      pointB: { ...DEFAULTS.pointB },
      angle: DEFAULTS.angle,
      perspective: DEFAULTS.perspective,
      orbitX: DEFAULTS.orbitX,
      orbitY: DEFAULTS.orbitY,
    };

    // ============================================================
    // DOM REFS
    // ============================================================
    const stageEl = document.getElementById('stage');
    const canvas3d = document.getElementById('canvas-3d');
    const layersWrap = document.getElementById('layers-wrap');
    const layerTop = document.getElementById('layer-top');
    const layerBottom = document.getElementById('layer-bottom');
    const overlay = document.getElementById('overlay');
    const breakLine = document.getElementById('break-line');
    const handleA = document.getElementById('handle-a');
    const handleB = document.getElementById('handle-b');
    const dropzone = document.getElementById('dropzone');
    const dropzoneTarget = document.getElementById('dropzone-target');
    const fileInput = document.getElementById('file-input');

    // UI controls
    const ctlAngle = document.getElementById('ctl-angle');
    const ctlDepth = document.getElementById('ctl-depth');
    const valAngle = document.getElementById('val-angle');
    const valDepth = document.getElementById('val-depth');
    const filenameEl = document.getElementById('filename');

    // ============================================================
    // GEOMETRY HELPERS
    // ============================================================

    // Returns the normalized axis direction for the line, oriented so that
    // the right-hand-perpendicular points "down" (positive y in canvas).
    // This way the math for top/bottom rotation signs is consistent.
    function axis() {
      let dx = state.pointB.x - state.pointA.x;
      let dy = state.pointB.y - state.pointA.y;
      const len = Math.hypot(dx, dy) || 1;
      let ux = dx / len;
      let uy = dy / len;
      // Orient so perpendicular (-uy, ux) points down (uy >= 0 means perp.y = ux)
      // Want perp.y >= 0, i.e. ux >= 0. If not, flip.
      if (ux < 0 || (ux === 0 && uy < 0)) {
        ux = -ux;
        uy = -uy;
      }
      return { ux, uy };
    }

    // Cross product sign of (P - A) × (B - A) — tells us which side of the line a point is on.
    // Positive = right side relative to A→B direction.
    function sideOfLine(px, py, ax, ay, bx, by) {
      return (bx - ax) * (py - ay) - (by - ay) * (px - ax);
    }

    // ============================================================
    // UPDATE
    // ============================================================
    function update() {
      const { x: ax, y: ay } = state.pointA;
      const { x: bx, y: by } = state.pointB;
      const { ux, uy } = axis();

      // Clip paths in % of the canvas-3d element.
      // We compute the polygons for each half (split by the line) and
      // intentionally OVERLAP them by `overlap` along the line's perpendicular
      // direction. This eliminates any sub-pixel gap at the seam when the
      // halves rotate independently in 3D.
      const corners = [
        { x: 0, y: 0 },
        { x: 1, y: 0 },
        { x: 1, y: 1 },
        { x: 0, y: 1 },
      ];
      const cornerSides = corners.map(c => sideOfLine(c.x, c.y, ax, ay, bx, by));

      const topPolyPoints = [];
      const bottomPolyPoints = [];
      for (let i = 0; i < 4; i++) {
        const next = (i + 1) % 4;
        const c = corners[i];
        const cn = corners[next];
        const s = cornerSides[i];
        const sn = cornerSides[next];

        if (s <= 0) topPolyPoints.push({ x: c.x, y: c.y, onLine: false });
        if (s >= 0) bottomPolyPoints.push({ x: c.x, y: c.y, onLine: false });

        if (s * sn < 0) {
          const inter = lineIntersect(c, cn, state.pointA, state.pointB);
          if (inter) {
            topPolyPoints.push({ x: inter.x, y: inter.y, onLine: true });
            bottomPolyPoints.push({ x: inter.x, y: inter.y, onLine: true });
          }
        }
      }

      // Apply overlap to the on-line points: shift each half's seam outward
      // into the OTHER half's territory by a tiny amount. With perpendicular
      // (-uy, ux) pointing toward the bottom side, top extends in +perpendicular
      // and bottom extends in -perpendicular.
      const overlap = 0.004; // 0.4% of canvas — enough to hide AA gaps
      const perpX = -uy * overlap;
      const perpY = ux * overlap;
      topPolyPoints.forEach(p => {
        if (p.onLine) { p.x += perpX; p.y += perpY; }
      });
      bottomPolyPoints.forEach(p => {
        if (p.onLine) { p.x -= perpX; p.y -= perpY; }
      });

      const polyToCSS = pts => 'polygon(' + pts.map(p => `${p.x * 100}% ${p.y * 100}%`).join(', ') + ')';
      layerTop.style.clipPath = polyToCSS(topPolyPoints);
      layerBottom.style.clipPath = polyToCSS(bottomPolyPoints);

      // Transform origin at line midpoint
      const midX = (ax + bx) / 2;
      const midY = (ay + by) / 2;
      const tof = `${midX * 100}% ${midY * 100}%`;
      layerTop.style.transformOrigin = tof;
      layerBottom.style.transformOrigin = tof;

      // Fold rotation around the line axis
      layerTop.style.transform = `rotate3d(${ux}, ${uy}, 0, ${-state.angle}deg)`;
      layerBottom.style.transform = `rotate3d(${ux}, ${uy}, 0, ${state.angle}deg)`;

      // Perspective on the parent
      canvas3d.style.perspective = `${state.perspective}px`;

      // Apply orbit (view rotation) to the layers-wrap. The SVG overlay is
      // inside layers-wrap so the line/handles rotate visually with the image,
      // staying "stuck" to the source.
      layersWrap.style.transform = `rotateX(${state.orbitX}deg) rotateY(${state.orbitY}deg)`;

      // Update SVG overlay (line + handles)
      breakLine.setAttribute('x1', ax * 100);
      breakLine.setAttribute('y1', ay * 100);
      breakLine.setAttribute('x2', bx * 100);
      breakLine.setAttribute('y2', by * 100);
      handleA.setAttribute('cx', ax * 100);
      handleA.setAttribute('cy', ay * 100);
      handleB.setAttribute('cx', bx * 100);
      handleB.setAttribute('cy', by * 100);

      // UI labels
      valAngle.textContent = state.angle + '°';
      valDepth.textContent = state.perspective;
      ctlAngle.value = state.angle;
      ctlDepth.value = state.perspective;
    }

    // Line segment intersection: returns intersection point of segment (a,b)
    // with the infinite line through (c,d). Returns null if parallel.
    function lineIntersect(a, b, c, d) {
      const x1 = a.x, y1 = a.y;
      const x2 = b.x, y2 = b.y;
      const x3 = c.x, y3 = c.y;
      const x4 = d.x, y4 = d.y;
      const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
      if (Math.abs(denom) < 1e-9) return null;
      const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
      return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) };
    }

    // ============================================================
    // CANVAS SIZING (keep image aspect)
    // ============================================================
    function fitCanvas() {
      if (!state.imageW || !state.imageH) return;
      const rect = stageEl.getBoundingClientRect();
      const aspect = state.imageW / state.imageH;
      const containerAspect = rect.width / rect.height;
      let w, h;
      if (aspect > containerAspect) {
        w = rect.width * 0.85;
        h = w / aspect;
      } else {
        h = rect.height * 0.85;
        w = h * aspect;
      }
      canvas3d.style.width = w + 'px';
      canvas3d.style.height = h + 'px';
    }

    window.addEventListener('resize', fitCanvas);

    // ============================================================
    // IMAGE UPLOAD
    // ============================================================
    function loadImageFromFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      state.filename = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        state.imageSrc = dataUrl;
        const img = new Image();
        img.onload = () => {
          state.imageW = img.naturalWidth;
          state.imageH = img.naturalHeight;
          layerTop.src = dataUrl;
          layerBottom.src = dataUrl;
          canvas3d.classList.add('has-image');
          dropzone.classList.add('hidden');
          filenameEl.style.display = 'block';
          filenameEl.textContent = file.name;
          fitCanvas();
          update();
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    }

    // Drop zone events
    dropzoneTarget.addEventListener('click', () => fileInput.click());
    dropzoneTarget.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzoneTarget.classList.add('drag-over');
    });
    dropzoneTarget.addEventListener('dragleave', () => dropzoneTarget.classList.remove('drag-over'));
    dropzoneTarget.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzoneTarget.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) loadImageFromFile(file);
    });

    // Whole-window drag to drop (so users can drop anywhere)
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) loadImageFromFile(file);
    });

    // Upload button + file input
    document.getElementById('ctl-upload').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) loadImageFromFile(file);
      fileInput.value = '';
    });

    // ============================================================
    // DRAGGABLE HANDLES
    // ============================================================
    const drag = { active: null, pointerId: null };

    function handlePointerToCanvas(e) {
      const rect = canvas3d.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      // Clamp gently — allow handles to go slightly past edges for flexibility
      return {
        x: Math.max(-0.05, Math.min(1.05, x)),
        y: Math.max(-0.05, Math.min(1.05, y)),
      };
    }

    function startDrag(e, point) {
      e.preventDefault();
      drag.active = point;
      drag.pointerId = e.pointerId;
      const handle = point === 'a' ? handleA : handleB;
      handle.classList.add('dragging');
      handle.setPointerCapture(e.pointerId);
    }

    function moveDrag(e) {
      if (!drag.active) return;
      const pos = handlePointerToCanvas(e);
      if (drag.active === 'a') state.pointA = pos;
      else state.pointB = pos;
      update();
    }

    function endDrag(e) {
      if (!drag.active) return;
      const handle = drag.active === 'a' ? handleA : handleB;
      handle.classList.remove('dragging');
      try { handle.releasePointerCapture(drag.pointerId); } catch (_) {}
      drag.active = null;
      drag.pointerId = null;
    }

    handleA.addEventListener('pointerdown', (e) => { e.stopPropagation(); startDrag(e, 'a'); });
    handleB.addEventListener('pointerdown', (e) => { e.stopPropagation(); startDrag(e, 'b'); });
    handleA.addEventListener('pointermove', moveDrag);
    handleB.addEventListener('pointermove', moveDrag);
    handleA.addEventListener('pointerup', endDrag);
    handleB.addEventListener('pointerup', endDrag);
    handleA.addEventListener('pointercancel', endDrag);
    handleB.addEventListener('pointercancel', endDrag);

    // ============================================================
    // ORBIT DRAG (drag image to rotate the view in 3D)
    // ============================================================
    const orbit = { active: false, prevX: 0, prevY: 0, vx: 0, vy: 0, pointerId: null };
    const ORBIT_DAMPING = 0.92;
    const ORBIT_SENSITIVITY = 0.5; // degrees per pixel
    const ORBIT_VELOCITY_EPS = 0.01;
    const ORBIT_LIMIT = 80; // clamp orbit-x to avoid flipping past horizon

    layersWrap.addEventListener('pointerdown', (e) => {
      if (drag.active) return;            // handle drag has priority
      if (!state.imageSrc) return;         // nothing to orbit
      orbit.active = true;
      orbit.prevX = e.clientX;
      orbit.prevY = e.clientY;
      orbit.vx = 0;
      orbit.vy = 0;
      orbit.pointerId = e.pointerId;
      try { layersWrap.setPointerCapture(e.pointerId); } catch (_) {}
    });

    layersWrap.addEventListener('pointermove', (e) => {
      if (!orbit.active) return;
      const dx = e.clientX - orbit.prevX;
      const dy = e.clientY - orbit.prevY;
      orbit.vx = dx * ORBIT_SENSITIVITY;
      orbit.vy = dy * ORBIT_SENSITIVITY;
      // Horizontal drag → rotate around Y; vertical drag → rotate around X (inverted)
      state.orbitY += orbit.vx;
      state.orbitX = Math.max(-ORBIT_LIMIT, Math.min(ORBIT_LIMIT, state.orbitX - orbit.vy));
      orbit.prevX = e.clientX;
      orbit.prevY = e.clientY;
      update();
    });

    const endOrbit = (e) => {
      if (!orbit.active) return;
      orbit.active = false;
      try { layersWrap.releasePointerCapture(orbit.pointerId); } catch (_) {}
      orbit.pointerId = null;
    };
    layersWrap.addEventListener('pointerup', endOrbit);
    layersWrap.addEventListener('pointercancel', endOrbit);
    layersWrap.addEventListener('pointerleave', endOrbit);

    // Inertia loop — keeps spinning briefly after drag release for natural feel
    function animate() {
      requestAnimationFrame(animate);
      if (!orbit.active) {
        if (Math.abs(orbit.vx) > ORBIT_VELOCITY_EPS || Math.abs(orbit.vy) > ORBIT_VELOCITY_EPS) {
          state.orbitY += orbit.vx;
          state.orbitX = Math.max(-ORBIT_LIMIT, Math.min(ORBIT_LIMIT, state.orbitX - orbit.vy));
          orbit.vx *= ORBIT_DAMPING;
          orbit.vy *= ORBIT_DAMPING;
          update();
        } else {
          orbit.vx = 0;
          orbit.vy = 0;
        }
      }
    }
    requestAnimationFrame(animate);

    // ============================================================
    // CONTROLS
    // ============================================================
    ctlAngle.addEventListener('input', (e) => {
      state.angle = parseFloat(e.target.value);
      update();
    });
    ctlDepth.addEventListener('input', (e) => {
      state.perspective = parseFloat(e.target.value);
      update();
    });

    document.getElementById('ctl-reset-line').addEventListener('click', () => {
      state.pointA = { ...DEFAULTS.pointA };
      state.pointB = { ...DEFAULTS.pointB };
      update();
    });

    document.getElementById('ctl-reset-view').addEventListener('click', () => {
      state.orbitX = DEFAULTS.orbitX;
      state.orbitY = DEFAULTS.orbitY;
      orbit.vx = 0;
      orbit.vy = 0;
      update();
    });

    document.getElementById('ctl-reset').addEventListener('click', () => {
      Object.assign(state, {
        pointA: { ...DEFAULTS.pointA },
        pointB: { ...DEFAULTS.pointB },
        angle: DEFAULTS.angle,
        perspective: DEFAULTS.perspective,
        orbitX: DEFAULTS.orbitX,
        orbitY: DEFAULTS.orbitY,
      });
      orbit.vx = 0;
      orbit.vy = 0;
      update();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.key.toLowerCase()) {
        case 'r':
          Object.assign(state, {
            pointA: { ...DEFAULTS.pointA },
            pointB: { ...DEFAULTS.pointB },
            angle: DEFAULTS.angle,
            perspective: DEFAULTS.perspective,
            orbitX: DEFAULTS.orbitX,
            orbitY: DEFAULTS.orbitY,
          });
          orbit.vx = 0;
          orbit.vy = 0;
          update();
          break;
        case 'v':
          state.orbitX = DEFAULTS.orbitX;
          state.orbitY = DEFAULTS.orbitY;
          orbit.vx = 0;
          orbit.vy = 0;
          update();
          break;
        case 's':
          if (state.imageSrc) exportSVG();
          break;
        case 'p':
          if (state.imageSrc) exportPNG();
          break;
      }
    });

    // ============================================================
    // EXPORT — shared mesh + SVG / PNG
    // ============================================================

    /** 3D rotation around an arbitrary axis (ux, uy, 0) using Rodrigues' formula. */
    function rotateAroundAxis(p, ux, uy, theta) {
      const c = Math.cos(theta);
      const s = Math.sin(theta);
      const t = 1 - c;
      const x = (c + ux * ux * t) * p.x + (ux * uy * t) * p.y + (uy * s) * p.z;
      const y = (ux * uy * t) * p.x + (c + uy * uy * t) * p.y + (-ux * s) * p.z;
      const z = (-uy * s) * p.x + (ux * s) * p.y + c * p.z;
      return { x, y, z };
    }

    /** Rotation around X axis by theta (radians). */
    function rotateX(p, theta) {
      const c = Math.cos(theta), s = Math.sin(theta);
      return { x: p.x, y: c * p.y - s * p.z, z: s * p.y + c * p.z };
    }

    /** Rotation around Y axis by theta (radians). */
    function rotateY(p, theta) {
      const c = Math.cos(theta), s = Math.sin(theta);
      return { x: c * p.x + s * p.z, y: p.y, z: -s * p.x + c * p.z };
    }

    /**
     * Project a point (cx, cy) in canvas-local pixel coords through:
     *   (1) fold rotation around line axis (transform-origin = line midpoint)
     *   (2) orbit rotation around canvas center (rotateY then rotateX)
     *   (3) CSS perspective projection (perspective-origin = canvas center)
     * Returns 2D screen position in canvas-3d pixel space.
     */
    function projectPointFull(cx, cy, halfSign, params) {
      const { W, H, originX, originY, ux, uy, angleRad, P, orbitXRad, orbitYRad } = params;

      // --- (1) Fold around line axis ---
      let p = { x: cx - originX, y: cy - originY, z: 0 };
      p = rotateAroundAxis(p, ux, uy, halfSign * angleRad);
      p.x += originX;
      p.y += originY;

      // --- (2) Orbit around canvas center ---
      const cX = W / 2, cY = H / 2;
      let q = { x: p.x - cX, y: p.y - cY, z: p.z };
      // CSS transform "rotateX(a) rotateY(b)" applies rotateY first to the local point, then rotateX
      q = rotateY(q, orbitYRad);
      q = rotateX(q, orbitXRad);
      q.x += cX;
      q.y += cY;

      // --- (3) Perspective projection ---
      const f = P / (P - q.z);
      return {
        x: cX + (q.x - cX) * f,
        y: cY + (q.y - cY) * f,
      };
    }

    /** Affine matrix mapping source triangle to destination triangle. Returns [a,b,c,d,e,f]. */
    function computeAffine(u0, v0, u1, v1, u2, v2, x0, y0, x1, y1, x2, y2) {
      const du1 = u1 - u0, dv1 = v1 - v0;
      const du2 = u2 - u0, dv2 = v2 - v0;
      const dx1 = x1 - x0, dy1 = y1 - y0;
      const dx2 = x2 - x0, dy2 = y2 - y0;
      const det = du1 * dv2 - du2 * dv1;
      if (Math.abs(det) < 1e-9) return null;
      const inv = 1 / det;
      const a = (dx1 * dv2 - dx2 * dv1) * inv;
      const c = (-dx1 * du2 + dx2 * du1) * inv;
      const b = (dy1 * dv2 - dy2 * dv1) * inv;
      const d = (-dy1 * du2 + dy2 * du1) * inv;
      const e = x0 - a * u0 - c * v0;
      const f = y0 - b * u0 - d * v0;
      return [a, b, c, d, e, f];
    }

    /** Point-in-polygon (ray casting). poly is array of {x, y}. */
    function pointInPoly(px, py, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersect = ((yi > py) !== (yj > py)) &&
          (px < (xj - xi) * (py - yi) / (yj - yi + 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    /**
     * Build the triangle mesh for export. Returns:
     *   { triangles: [[{u,v,x,y},{u,v,x,y},{u,v,x,y}], ...], bbox: {minX,minY,maxX,maxY} }
     * Each triangle has source UV coords (in image pixel space) and destination XY coords
     * (in canvas-3d screen pixel space, after fold+orbit+perspective).
     */
    function buildExportMesh(N) {
      const W = canvas3d.clientWidth;
      const H = canvas3d.clientHeight;
      const { ux, uy } = axis();
      const angleRad = state.angle * Math.PI / 180;
      const P = state.perspective;
      const originX = ((state.pointA.x + state.pointB.x) / 2) * W;
      const originY = ((state.pointA.y + state.pointB.y) / 2) * H;
      const orbitXRad = state.orbitX * Math.PI / 180;
      const orbitYRad = state.orbitY * Math.PI / 180;
      const params = { W, H, originX, originY, ux, uy, angleRad, P, orbitXRad, orbitYRad };

      const corners = [
        { x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H },
      ];
      const Apx = { x: state.pointA.x * W, y: state.pointA.y * H };
      const Bpx = { x: state.pointB.x * W, y: state.pointB.y * H };
      const cornerSides = corners.map(c => sideOfLine(c.x, c.y, Apx.x, Apx.y, Bpx.x, Bpx.y));

      const halves = [
        { sign: -1, cornerTest: (s) => s <= 0 },
        { sign: +1, cornerTest: (s) => s >= 0 },
      ];

      const halfPolygons = halves.map((half) => {
        const pts = [];
        for (let i = 0; i < 4; i++) {
          const next = (i + 1) % 4;
          const c = corners[i], cn = corners[next];
          const s = cornerSides[i], sn = cornerSides[next];
          if (half.cornerTest(s)) pts.push(c);
          if (s * sn < 0) {
            const inter = lineIntersect(c, cn, Apx, Bpx);
            if (inter) pts.push(inter);
          }
        }
        return pts;
      });

      // For each half, project (N+1) × (N+1) grid points
      const halfDests = halves.map((half) => {
        const dest = [];
        for (let iy = 0; iy <= N; iy++) {
          for (let ix = 0; ix <= N; ix++) {
            const u = (ix / N) * W;
            const v = (iy / N) * H;
            const projected = projectPointFull(u, v, half.sign, params);
            dest.push({ u, v, x: projected.x, y: projected.y });
          }
        }
        return dest;
      });

      // Collect triangles (only those whose centroid is inside the half's polygon)
      const triangles = [];
      for (let halfIdx = 0; halfIdx < halves.length; halfIdx++) {
        const dest = halfDests[halfIdx];
        const poly = halfPolygons[halfIdx];
        for (let iy = 0; iy < N; iy++) {
          for (let ix = 0; ix < N; ix++) {
            const i00 = iy * (N + 1) + ix;
            const i10 = i00 + 1;
            const i01 = i00 + (N + 1);
            const i11 = i01 + 1;
            const candidates = [
              [dest[i00], dest[i10], dest[i11]],
              [dest[i00], dest[i11], dest[i01]],
            ];
            for (const tri of candidates) {
              const cu = (tri[0].u + tri[1].u + tri[2].u) / 3;
              const cv = (tri[0].v + tri[1].v + tri[2].v) / 3;
              if (pointInPoly(cu, cv, poly)) triangles.push(tri);
            }
          }
        }
      }

      // Convert source UVs from canvas pixel space to image pixel space
      const scaleU = state.imageW / W;
      const scaleV = state.imageH / H;
      for (const tri of triangles) {
        for (const p of tri) {
          p.u *= scaleU;
          p.v *= scaleV;
        }
      }

      // Compute bounding box of destinations
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const tri of triangles) {
        for (const p of tri) {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        }
      }
      return { triangles, bbox: { minX, minY, maxX, maxY } };
    }

    function exportSVG() {
      const { triangles, bbox } = buildExportMesh(16);
      const pad = 20;
      const minX = bbox.minX - pad, minY = bbox.minY - pad;
      const maxX = bbox.maxX + pad, maxY = bbox.maxY + pad;
      const svgW = maxX - minX, svgH = maxY - minY;

      const parts = [];
      parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${svgW.toFixed(2)}" height="${svgH.toFixed(2)}" viewBox="${minX.toFixed(2)} ${minY.toFixed(2)} ${svgW.toFixed(2)} ${svgH.toFixed(2)}">`);
      parts.push(`<defs>`);
      triangles.forEach((tri, i) => {
        parts.push(`<clipPath id="t${i}" clipPathUnits="userSpaceOnUse"><polygon points="${tri.map(p => `${p.u.toFixed(2)},${p.v.toFixed(2)}`).join(' ')}" /></clipPath>`);
      });
      parts.push(`</defs>`);
      triangles.forEach((tri, i) => {
        const m = computeAffine(
          tri[0].u, tri[0].v, tri[1].u, tri[1].v, tri[2].u, tri[2].v,
          tri[0].x, tri[0].y, tri[1].x, tri[1].y, tri[2].x, tri[2].y
        );
        if (!m) return;
        const matrix = `matrix(${m.map(n => n.toFixed(4)).join(' ')})`;
        parts.push(`<g transform="${matrix}"><image href="${state.imageSrc}" width="${state.imageW}" height="${state.imageH}" clip-path="url(#t${i})" preserveAspectRatio="none" /></g>`);
      });
      parts.push(`</svg>`);
      const svg = parts.join('\n');

      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `image-fold-${Date.now()}.svg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    function exportPNG(scale = 2) {
      const { triangles, bbox } = buildExportMesh(20);
      const pad = 20;
      const minX = bbox.minX - pad, minY = bbox.minY - pad;
      const maxX = bbox.maxX + pad, maxY = bbox.maxY + pad;
      const w = (maxX - minX);
      const h = (maxY - minY);

      // Create canvas at scale × screen resolution
      const cv = document.createElement('canvas');
      cv.width = Math.round(w * scale);
      cv.height = Math.round(h * scale);
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // Translate so bbox.minX/Y maps to 0 in canvas, scale to scale factor
      ctx.scale(scale, scale);
      ctx.translate(-minX, -minY);

      const img = new Image();
      img.onload = () => {
        // Draw each triangle: clip to dest triangle, set affine matrix, drawImage(img, 0, 0, srcW, srcH)
        // The matrix is constructed so that source (u, v) maps to destination (x, y).
        for (const tri of triangles) {
          const m = computeAffine(
            tri[0].u, tri[0].v, tri[1].u, tri[1].v, tri[2].u, tri[2].v,
            tri[0].x, tri[0].y, tri[1].x, tri[1].y, tri[2].x, tri[2].y
          );
          if (!m) continue;
          ctx.save();
          // Clip to destination triangle (so neighbours don't overdraw past their share)
          ctx.beginPath();
          ctx.moveTo(tri[0].x, tri[0].y);
          ctx.lineTo(tri[1].x, tri[1].y);
          ctx.lineTo(tri[2].x, tri[2].y);
          ctx.closePath();
          ctx.clip();
          // Apply the source-to-destination affine
          ctx.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
          ctx.drawImage(img, 0, 0, state.imageW, state.imageH);
          ctx.restore();
        }
        // Trigger download
        cv.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `image-fold-${Date.now()}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 100);
        }, 'image/png');
      };
      img.src = state.imageSrc;
    }

    document.getElementById('ctl-export-svg').addEventListener('click', () => {
      if (state.imageSrc) exportSVG();
    });
    document.getElementById('ctl-export-png').addEventListener('click', () => {
      if (state.imageSrc) exportPNG(2);
    });

    // ============================================================
    // INIT
    // ============================================================
    update();
  </script>
</body>
</html>
